<div class="cv">
  <section class="panel pick">
    <div class="swatch" id="swatch"><span id="sw-text">Aa</span></div>
    <div class="row">
      <input type="color" id="picker" value="#2440c4" aria-label="Color picker">
      <div class="field grow"><label for="code" id="l-code"></label><input id="code" type="text" value="#2440c4" spellcheck="false" autocomplete="off"></div>
    </div>
    <p class="err" id="err" hidden></p>
  </section>
  <section class="panel">
    <table class="codes"><tbody id="codes"></tbody></table>
  </section>
  <section class="panel">
    <h2 class="eyebrow" id="l-contrast"></h2>
    <div class="contrast" id="contrast"></div>
  </section>
  <section class="panel">
    <h2 class="eyebrow" id="l-scale"></h2>
    <div class="scale" id="scale"></div>
  </section>
</div>
