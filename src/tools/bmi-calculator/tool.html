<div class="bmi">
  <section class="panel">
    <div class="seg" role="group" id="units" hidden><button type="button" data-u="metric" aria-pressed="true">cm / kg</button><button type="button" data-u="imperial" aria-pressed="false">ft·in / lb</button></div>
    <div class="row" id="metric">
      <div class="field"><label for="h" id="l-h"></label><input id="h" type="number" step="0.1" min="50" max="250" value="170" inputmode="decimal"></div>
      <div class="field"><label for="w" id="l-w"></label><input id="w" type="number" step="0.1" min="10" max="300" value="65" inputmode="decimal"></div>
    </div>
    <div class="row" id="imperial" hidden>
      <div class="field"><label for="ft">Height (ft)</label><input id="ft" type="number" min="3" max="8" value="5" inputmode="numeric"></div>
      <div class="field"><label for="in">(in)</label><input id="in" type="number" min="0" max="11.9" step="0.1" value="7" inputmode="decimal"></div>
      <div class="field"><label for="lb">Weight (lb)</label><input id="lb" type="number" min="20" max="700" step="0.1" value="143" inputmode="decimal"></div>
    </div>
    <div class="result" aria-live="polite">
      <div class="big"><span class="eyebrow">BMI</span><strong id="bmi"></strong><span class="cat" id="cat"></span></div>
      <div class="scale" id="scale"><div class="bands" id="bands"></div><i class="mark" id="mark"></i></div>
      <dl class="facts" id="facts"></dl>
    </div>
  </section>
  <p class="note" id="note"></p>
</div>
