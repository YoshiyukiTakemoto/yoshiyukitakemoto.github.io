<section class="controls">
  <div class="field"><label for="fmt" id="l-fmt"></label><select id="fmt"></select></div>
  <div class="field"><label for="q" id="l-q"></label><div class="range"><input type="range" id="q" min="30" max="100" step="1" value="80"><output id="qv">80</output></div></div>
  <div class="field"><label for="max" id="l-max"></label><select id="max"></select></div>
</section>
<label class="drop" id="drop" for="file">
  <strong id="d-title"></strong>
  <span class="sub" id="d-sub"></span>
  <span class="btn primary" id="d-btn"></span>
  <input type="file" id="file" accept="image/*" multiple hidden>
</label>
<p class="sample"><button type="button" class="link" id="sample"></button></p>
<div class="summary" id="summary" hidden>
  <span class="pill ok" id="total"></span><span class="sp"></span>
  <button class="btn" type="button" id="clear"></button>
  <button class="btn primary" type="button" id="zip"></button>
</div>
<ul class="list" id="list"></ul>
