<div class="sd">
  <div class="top">
    <div class="seg" role="group" id="levels"></div>
    <span class="today" id="today"></span>
    <span class="sp"></span>
    <span class="stat"><span class="eyebrow" id="l-time"></span><b class="num" id="time">0:00</b></span>
    <span class="stat"><span class="eyebrow" id="l-miss"></span><b class="num" id="miss">0</b></span>
    <span class="stat"><span class="eyebrow" id="l-streak"></span><b class="num" id="streak">0</b></span>
  </div>
  <div class="play">
    <div class="board" id="board" role="grid" tabindex="0"></div>
    <div class="side">
      <div class="pad" id="pad"></div>
      <div class="tools">
        <button class="btn" type="button" id="notes" aria-pressed="false"></button>
        <button class="btn" type="button" id="erase"></button>
        <button class="btn" type="button" id="undo"></button>
      </div>
      <label class="check"><input type="checkbox" id="showerr" checked><span id="l-showerr"></span></label>
      <button class="btn" type="button" id="random"></button>
      <div class="done" id="done" hidden><strong id="done-msg"></strong><div id="share"></div></div>
    </div>
  </div>
</div>
