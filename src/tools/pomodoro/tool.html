<div class="pomo">
  <section class="panel timer" id="timer">
    <div class="modes" role="group" id="modes"><button type="button" data-m="work" id="m-work"></button><button type="button" data-m="short" id="m-short"></button><button type="button" data-m="long" id="m-long"></button></div>
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" class="track"/><circle cx="60" cy="60" r="54" class="prog" id="prog"/></svg><div class="time num" id="time" role="timer" aria-live="off">25:00</div></div>
    <div class="ctl"><button class="btn primary big" type="button" id="start"></button><button class="btn" type="button" id="reset"></button><button class="btn" type="button" id="skip"></button></div>
    <p class="count" id="count"></p>
  </section>
  <section class="panel settings">
    <h2 class="eyebrow" id="l-settings"></h2>
    <div class="grid3">
      <div class="field"><label for="d-work" id="l-dwork"></label><input id="d-work" type="number" min="1" max="180" value="25"></div>
      <div class="field"><label for="d-short" id="l-dshort"></label><input id="d-short" type="number" min="1" max="60" value="5"></div>
      <div class="field"><label for="d-long" id="l-dlong"></label><input id="d-long" type="number" min="1" max="90" value="15"></div>
      <div class="field"><label for="every" id="l-every"></label><input id="every" type="number" min="2" max="12" value="4"></div>
    </div>
    <label class="check"><input type="checkbox" id="auto" checked><span id="l-auto"></span></label>
    <label class="check"><input type="checkbox" id="sound" checked><span id="l-sound"></span></label>
    <label class="check"><input type="checkbox" id="notify"><span id="l-notify"></span></label>
    <div class="week" id="week"></div>
  </section>
</div>
