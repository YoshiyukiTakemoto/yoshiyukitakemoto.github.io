<div class="lw">

      <div class="field"><label for="span" id="l-span"></label><input id="span" type="number" min="30" max="120" value="85"></div>

    <div class="headline" aria-live="polite"><strong id="pct"></strong><span id="sub"></span></div>

  </section>
