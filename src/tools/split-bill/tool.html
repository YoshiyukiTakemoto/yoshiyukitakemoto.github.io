<div class="sb">
  <section class="panel">
    <div class="row">
      <div class="field"><label for="total" id="l-total"></label><input id="total" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label for="unit" id="l-unit"></label><select id="unit"></select></div>
      <div class="field"><label for="mode" id="l-mode"></label><select id="mode"></select></div>
    </div>
    <div class="people">
      <div class="ph"><span class="eyebrow" id="l-people"></span><span class="eyebrow" id="l-weight"></span><span></span></div>
      <ul id="people"></ul>
      <button class="btn" type="button" id="add"></button>
    </div>
  </section>
  <section class="panel">
    <div class="sum" id="sum"></div>
    <ul class="res" id="res"></ul>
    <div class="field"><label for="text" id="l-text"></label><textarea id="text" readonly></textarea></div>
    <button class="btn primary" type="button" id="copy"></button>
  </section>
</div>
