<div class="rl">
  <section class="panel wheel-box">
    <div class="wheel"><canvas id="wheel" width="720" height="720"></canvas><i class="pin" aria-hidden="true"></i></div>
    <button class="btn primary big" type="button" id="spin"></button>
    <p class="result" id="result" aria-live="polite"></p>
  </section>
  <section class="panel">
    <div class="field"><label for="items" id="l-items"></label><textarea id="items" spellcheck="false"></textarea></div>
    <label class="check"><input type="checkbox" id="remove"><span id="l-remove"></span></label>
    <div class="btns"><button class="btn" type="button" id="shuffle"></button><button class="btn" type="button" id="restore"></button></div>
    <div><span class="eyebrow" id="l-hist"></span><ol class="hist" id="hist"></ol></div>
  </section>
</div>
