<div class="kj">
  <div class="stage" id="stage">
    <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Kit Jump game"></canvas>
    <div class="touch" id="touch" hidden>
      <button type="button" data-k="left" aria-label="Left">◀</button>
      <button type="button" data-k="right" aria-label="Right">▶</button>
      <span class="sp"></span>
      <button type="button" data-k="jump" class="jump" aria-label="Jump">▲</button>
    </div>
    <button type="button" class="fs" id="fs" aria-label="Full screen">⛶</button>
  </div>
  <div class="below">
    <p class="keys" id="keys"></p>
    <div id="share"></div>
  </div>
</div>
