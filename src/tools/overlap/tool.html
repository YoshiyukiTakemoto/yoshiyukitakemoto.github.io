<section class="controls">
  <div class="field search">
    <label for="city-q" id="l-add"></label>
    <input id="city-q" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <div class="field"><label for="date" id="l-date"></label><input id="date" type="date"></div>
  <div class="field"><label for="ws" id="l-work"></label><div class="pair"><select id="ws"></select><span>–</span><select id="we"></select></div></div>
  <div class="field"><label for="dur" id="l-dur"></label><select id="dur"></select></div>
</section>
<div class="status"><span class="pill" id="verdict"></span><div class="legend" id="legend"></div></div>
<div class="scroller"><div class="grid" id="grid"></div></div>
<section class="slot" id="slot"></section>
